<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio Player</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #aaa;
            --border-color: #333;
            --drop-zone-bg: #252525;
            --drop-zone-border: #007bff;
            --drop-zone-hover: #2a2a3a;
            --btn-bg: #007bff;
            --btn-hover: #0056b3;
            --btn-active: #28a745;
            --btn-active-hover: #218838;
            --input-bg: #2a2a2a;
        }

        body.light-mode {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --border-color: #eee;
            --drop-zone-bg: #fafafa;
            --drop-zone-border: #007bff;
            --drop-zone-hover: #e9f0ff;
            --btn-bg: #007bff;
            --btn-hover: #0056b3;
            --btn-active: #28a745;
            --btn-active-hover: #218838;
            --input-bg: #f9f9f9;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }

        .player-container {
            background: var(--container-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            width: 380px;
            text-align: center;
            transition: background 0.3s;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h2 {
            margin: 0;
            font-size: 22px;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .drop-zone {
            border: 2px dashed var(--drop-zone-border);
            background: var(--drop-zone-bg);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 15px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.2s;
        }
        .drop-zone.dragover {
            background: var(--drop-zone-hover);
        }

        /* Bigger, thumb-friendly buttons */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            padding: 12px 16px;
            border: none;
            background: var(--btn-bg);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: var(--btn-hover);
        }
        button.active {
            background: var(--btn-active);
        }
        button.active:hover {
            background: var(--btn-active-hover);
        }

        /* Bigger, easier to grab range sliders */
        input[type="range"] {
            width: 100%;
            height: 8px;
            margin: 15px 0;
            accent-color: var(--btn-bg);
            cursor: pointer;
        }

        .section-group {
            margin-top: 20px;
            font-size: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            text-align: left;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 15px;
            margin-top: 8px;
            cursor: pointer;
        }

        #track-info {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="header-row">
            <h2>Audio Player</h2>
            <button class="theme-btn" id="themeToggleBtn">Light Mode</button>
        </div>
        
        <!-- Drag and Drop Zone / Import Button -->
        <div class="drop-zone" id="dropZone">
            Drag & Drop audio file here or<br><br>
            <button onclick="document.getElementById('fileInput').click()">Browse Files</button>
            <input type="file" id="fileInput" accept="audio/*" style="display: none;">
        </div>

        <div id="track-info">No file loaded</div>

        <!-- Audio Element -->
        <audio id="audioElement" playsinline></audio>

        <!-- Progress Bar -->
        <input type="range" id="progressBar" value="0" max="100" step="0.1">

        <!-- Playback Controls -->
        <div class="controls">
            <button id="rewindBtn">-15s</button>
            <button id="playPauseBtn">Play</button>
            <button id="forwardBtn">+15s</button>
            <button id="loopBtn">Loop: Off</button>
        </div>

        <!-- Speed Adjuster -->
        <div class="section-group">
            <label for="speedRange">Speed: <span id="speedValue">1.00</span>x</label><br>
            <input type="range" id="speedRange" min="0.5" max="3.0" step="0.05" value="1.0">
        </div>

        <!-- Sleep Timer -->
        <div class="section-group">
            <label for="sleepTimerSelect">Sleep Timer:</label>
            <select id="sleepTimerSelect">
                <option value="0">Off</option>
                <option value="5">5 Minutes</option>
                <option value="15">15 Minutes</option>
                <option value="30">30 Minutes</option>
                <option value="60">60 Minutes</option>
            </select>
            <div id="timerDisplay" style="font-size: 13px; color: var(--text-secondary); margin-top: 8px;"></div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioElement');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const loopBtn = document.getElementById('loopBtn');
        const progressBar = document.getElementById('progressBar');
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const trackInfo = document.getElementById('track-info');
        const speedRange = document.getElementById('speedRange');
        const speedValue = document.getElementById('speedValue');
        const sleepTimerSelect = document.getElementById('sleepTimerSelect');
        const timerDisplay = document.getElementById('timerDisplay');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        let sleepTimeout = null;
        let countdownInterval = null;

        // Theme Toggle Logic
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                themeToggleBtn.textContent = 'Dark Mode';
            } else {
                themeToggleBtn.textContent = 'Light Mode';
            }
        });

        // Load file from file input
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadAudioFile(file);
        });

        // Drag and Drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('audio/')) {
                loadAudioFile(file);
            } else {
                alert('Please drop a valid audio file.');
            }
        });

        function loadAudioFile(file) {
            const fileURL = URL.createObjectURL(file);
            audio.src = fileURL;
            trackInfo.textContent = `Loaded: ${file.name}`;
            
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: file.name,
                    artist: 'Voice Memo / Audio Player'
                });
            }

            audio.play();
            playPauseBtn.textContent = 'Pause';
        }

        // Play / Pause Toggle
        playPauseBtn.addEventListener('click', () => {
            if (!audio.src) {
                alert('Please load an audio file first.');
                return;
            }
            if (audio.paused) {
                audio.play();
                playPauseBtn.textContent = 'Pause';
            } else {
                audio.pause();
                playPauseBtn.textContent = 'Play';
            }
        });

        // Skip -15s and +15s
        rewindBtn.addEventListener('click', () => {
            audio.currentTime = Math.max(0, audio.currentTime - 15);
        });

        forwardBtn.addEventListener('click', () => {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 15);
        });

        // Loop Toggle
        loopBtn.addEventListener('click', () => {
            audio.loop = !audio.loop;
            if (audio.loop) {
                loopBtn.textContent = 'Loop: On';
                loopBtn.classList.add('active');
            } else {
                loopBtn.textContent = 'Loop: Off';
                loopBtn.classList.remove('active');
            }
        });

        // Update progress bar as audio plays
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
            }
        });

        // Seek audio using progress bar
        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        // Speed adjuster (up to 3.00x)
        speedRange.addEventListener('input', () => {
            const speed = parseFloat(speedRange.value);
            audio.playbackRate = speed;
            speedValue.textContent = speed.toFixed(2);
        });

        // Sleep Timer logic
        sleepTimerSelect.addEventListener('change', () => {
            clearTimeout(sleepTimeout);
            clearInterval(countdownInterval);
            timerDisplay.textContent = '';

            const minutes = parseInt(sleepTimerSelect.value);
            if (minutes === 0) return;

            let timeRemaining = minutes * 60;
            
            countdownInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(countdownInterval);
                    return;
                }
                timeRemaining--;
                let m = Math.floor(timeRemaining / 60);
                let s = timeRemaining % 60;
                timerDisplay.textContent = `Stopping in ${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);

            sleepTimeout = setTimeout(() => {
                audio.pause();
                playPauseBtn.textContent = 'Play';
                sleepTimerSelect.value = "0";
                timerDisplay.textContent = 'Timer finished (paused)';
                clearInterval(countdownInterval);
            }, minutes * 60 * 1000);
        });

        audio.addEventListener('ended', () => {
            if (!audio.loop) {
                playPauseBtn.textContent = 'Play';
            }
        });
    </script>
</body>
</html>
