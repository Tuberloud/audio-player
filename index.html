<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <style>
        :root {
            --ipod-bg: linear-gradient(135deg, #e6e6e6 0%, #b3b3b3 100%);
            --screen-bg: #c7d2c5;
            --screen-border: #4a5d4e;
            --text-color: #222;
            --text-secondary: #555;
            --btn-bg: #fcfcfc;
            --btn-hover: #e0e0e0;
            --wheel-bg: radial-gradient(circle, #f5f5f5 0%, #dcdcdc 100%);
            --wheel-border: #ccc;
            --highlight-bg: #4a5d4e;
            --highlight-text: #fff;
        }

        body.dark-mode {
            --ipod-bg: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);
            --screen-bg: #1e261f;
            --screen-border: #334433;
            --text-color: #e0e0e0;
            --text-secondary: #aaa;
            --btn-bg: #3a3a3a;
            --btn-hover: #4a4a4a;
            --wheel-bg: radial-gradient(circle, #333333 0%, #222222 100%);
            --wheel-border: #444;
            --highlight-bg: #334433;
            --highlight-text: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .player-container {
            background: var(--ipod-bg);
            padding: 25px 20px;
            border-radius: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.6);
            width: 320px;
            text-align: center;
            border: 2px solid #888;
            box-sizing: border-box;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-color);
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--text-secondary);
            color: var(--text-color);
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* iPod LCD Screen Container */
        .screen-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ipod-screen {
            background-color: var(--screen-bg);
            border: 3px solid var(--screen-border);
            border-radius: 8px;
            padding: 8px;
            height: 110px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            color: #111;
            text-align: left;
            overflow: hidden;
            position: relative;
        }

        body.dark-mode .ipod-screen {
            color: #d0ded0;
        }

        .screen-top {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: bold;
            opacity: 0.8;
            border-bottom: 1px solid var(--screen-border);
            padding-bottom: 2px;
        }

        /* iPod Menu Styles */
        .ipod-menu {
            overflow-y: auto;
            max-height: 70px;
            font-size: 12px;
            margin: 2px 0;
        }

        .menu-item {
            padding: 2px 4px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-radius: 3px;
        }

        .menu-item.selected {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
        }

        /* Loop Switch on the Right Side */
        .loop-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .loop-icon {
            font-size: 13px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 20px;
            height: 36px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #28a745; /* Green when on */
        }

        input:checked + .slider:before {
            transform: translateY(-16px);
        }

        /* Click Wheel Area */
        .click-wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 15px auto;
            background: var(--wheel-bg);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 2px 4px rgba(255,255,255,0.4);
            border: 1px solid var(--wheel-border);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-btn {
            position: absolute;
            background: transparent;
            border: none;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .wheel-menu { top: 12px; }
        .wheel-rewind { left: 8px; }
        .wheel-forward { right: 8px; }
        .wheel-play { bottom: 12px; }

        .center-button {
            width: 75px;
            height: 75px;
            background: var(--btn-bg);
            border-radius: 50%;
            border: 1px solid var(--wheel-border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .center-button:hover {
            background: var(--btn-hover);
        }

        input[type="range"] {
            width: 100%;
            accent-color: #555;
            cursor: pointer;
            margin: 3px 0;
        }

        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 10px;
        }

        .speed-control {
            text-align: left;
            font-size: 12px;
            color: var(--text-secondary);
            width: 100%;
        }

        /* Sleep Timer Section */
        .section-group {
            margin-top: 10px;
            font-size: 12px;
            text-align: left;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 8px;
        }

        select {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--wheel-border);
            background: var(--btn-bg);
            color: var(--text-color);
            font-size: 12px;
            margin-top: 4px;
            cursor: pointer;
        }

        #timerDisplay {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="header-row">
            <h2>Music Player</h2>
            <button class="theme-btn" id="themeToggleBtn">Theme</button>
        </div>
        
        <!-- iPod Screen and Right-Side Loop Switch -->
        <div class="screen-wrapper">
            <div class="ipod-screen">
                <div class="screen-top">
                    <span id="screenTitle">Music</span>
                    <span id="playStateIndicator">▶</span>
                </div>
                <!-- iPod Menu List -->
                <div class="ipod-menu" id="ipodMenu">
                    <div class="menu-item selected" data-action="upload">📁 Upload New File...</div>
                    <div class="menu-item" data-action="list">🎵 Saved Songs</div>
                </div>
                <div>
                    <input type="range" id="progressBar" value="0" max="100" step="0.1">
                </div>
            </div>

            <!-- Loop Switch on the Right Side -->
            <div class="loop-container">
                <span class="loop-icon">🔁</span>
                <label class="switch">
                    <input type="checkbox" id="loopToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <audio id="audioElement" playsinline></audio>

        <!-- Click Wheel -->
        <div class="click-wheel-container">
            <button class="wheel-btn wheel-menu" id="browseBtn">MENU</button>
            <button class="wheel-btn wheel-rewind" id="rewindBtn">⏮ -15s</button>
            <button class="wheel-btn wheel-forward" id="forwardBtn">+15s ⏭</button>
            <button class="wheel-btn wheel-play" id="playPauseBtn">⏯</button>
            <div class="center-button" id="centerActionBtn">SELECT</div>
        </div>

        <input type="file" id="fileInput" accept="audio/*, .m4a, .mp3, .wav" style="display: none;">

        <!-- Speed Control Row -->
        <div class="bottom-controls">
            <div class="speed-control">
                <label for="speedRange">Speed: <span id="speedValue">1.00</span>x</label><br>
                <input type="range" id="speedRange" min="0.5" max="3.0" step="0.05" value="1.0">
            </div>
        </div>

        <!-- Sleep Timer at the very bottom -->
        <div class="section-group">
            <label for="sleepTimerSelect">Sleep Timer:</label>
            <select id="sleepTimerSelect">
                <option value="0">Off</option>
                <option value="5">5 Minutes</option>
                <option value="15">15 Minutes</option>
                <option value="30">30 Minutes</option>
                <option value="60">60 Minutes</option>
            </select>
            <div id="timerDisplay"></div>
        </div>
        
        <div style="font-size: 10px; color: var(--text-secondary); margin-top: 8px;">🔒 Private Local Storage Enabled</div>
    </div>

    <script>
        const audio = document.getElementById('audioElement');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const centerActionBtn = document.getElementById('centerActionBtn');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const loopToggle = document.getElementById('loopToggle');
        const progressBar = document.getElementById('progressBar');
        const fileInput = document.getElementById('fileInput');
        const browseBtn = document.getElementById('browseBtn');
        const speedRange = document.getElementById('speedRange');
        const speedValue = document.getElementById('speedValue');
        const sleepTimerSelect = document.getElementById('sleepTimerSelect');
        const timerDisplay = document.getElementById('timerDisplay');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const playStateIndicator = document.getElementById('playStateIndicator');
        const ipodMenu = document.getElementById('ipodMenu');
        const screenTitle = document.getElementById('screenTitle');

        let sleepTimeout = null;
        let countdownInterval = null;
        let currentMenuState = 'main'; // 'main', 'songs', 'now_playing'
        let selectedMenuIndex = 0;

        function renderMenu() {
            ipodMenu.innerHTML = '';
            let items = [];

            if (currentMenuState === 'main') {
                screenTitle.textContent = 'Music';
                items = [
                    { label: '📁 Upload New File...', action: 'upload' },
                    { label: '🎵 Saved Songs', action: 'songs' }
                ];
                if (audio.src) {
                    items.push({ label: '▶ Now Playing', action: 'now_playing' });
                }
            } else if (currentMenuState === 'songs') {
                screenTitle.textContent = 'Saved Songs';
                let savedList = JSON.parse(localStorage.getItem('private_playlist') || '[]');
                if (savedList.length === 0) {
                    items = [{ label: '(No saved songs)', action: 'none' }];
                } else {
                    items = savedList.map((song, idx) => ({ label: `🎵 ${song.name}`, action: 'play_song', index: idx }));
                }
            } else if (currentMenuState === 'now_playing') {
                screenTitle.textContent = 'Now Playing';
                let currentSongName = localStorage.getItem('last_played_name') || 'Audio File';
                items = [{ label: `Playing: ${currentSongName}`, action: 'none' }];
            }

            items.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `menu-item ${idx === selectedMenuIndex ? 'selected' : ''}`;
                div.textContent = item.label;
                div.onclick = () => {
                    selectedMenuIndex = idx;
                    triggerAction(item);
                };
                ipodMenu.appendChild(div);
            });
        }

        function triggerAction(item) {
            if (!item) return;
            if (item.action === 'upload') {
                fileInput.click();
            } else if (item.action === 'songs') {
                currentMenuState = 'songs';
                selectedMenuIndex = 0;
                renderMenu();
            } else if (item.action === 'now_playing') {
                // Stay or toggle
            } else if (item.action === 'play_song') {
                playSavedSong(item.index);
            }
        }

        function playSavedSong(index) {
            let savedList = JSON.parse(localStorage.getItem('private_playlist') || '[]');
            let song = savedList[index];
            if (song) {
                audio.src = song.src;
                audio.load();
                localStorage.setItem('last_played_name', song.name);
                localStorage.setItem('last_played_index', index);
                audio.play().then(() => {
                    playStateIndicator.textContent = '▶';
                    centerActionBtn.textContent = 'PAUSE';
                }).catch(() => {
                    playStateIndicator.textContent = '❚❚';
                    centerActionBtn.textContent = 'PLAY';
                });
                currentMenuState = 'now_playing';
                renderMenu();
            }
        }

        // Handle File Upload smoothly via FileReader
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            screenTitle.textContent = 'Loading...';
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const base64Data = event.target.result;
                let savedList = JSON.parse(localStorage.getItem('private_playlist') || '[]');
                
                let existingIndex = savedList.findIndex(item => item.name === file.name);
                if (existingIndex !== -1) {
                    savedList[existingIndex].src = base64Data;
                } else {
                    savedList.push({ name: file.name, src: base64Data });
                    existingIndex = savedList.length - 1;
                }

                localStorage.setItem('private_playlist', JSON.stringify(savedList));
                localStorage.setItem('last_played_name', file.name);
                localStorage.setItem('last_played_index', existingIndex);

                audio.src = base64Data;
                audio.load();
                audio.play().then(() => {
                    playStateIndicator.textContent = '▶';
                    centerActionBtn.textContent = 'PAUSE';
                }).catch(() => {
                    playStateIndicator.textContent = '❚❚';
                    centerActionBtn.textContent = 'PLAY';
                });

                currentMenuState = 'now_playing';
                renderMenu();
            };

            reader.readAsDataURL(file);
        });

        // MENU Button takes you back to main menu or previous layer
        browseBtn.addEventListener('click', () => {
            if (currentMenuState === 'songs' || currentMenuState === 'now_playing') {
                currentMenuState = 'main';
                selectedMenuIndex = 0;
                renderMenu();
            } else {
                currentMenuState = 'main';
                selectedMenuIndex = 0;
                renderMenu();
            }
        });

        // Center Button Select Action
        centerActionBtn.addEventListener('click', () => {
            let savedList = currentMenuState === 'songs' ? JSON.parse(localStorage.getItem('private_playlist') || '[]') : [];
            if (currentMenuState === 'main') {
                if (selectedMenuIndex === 0) fileInput.click();
                else if (selectedMenuIndex === 1) {
                    currentMenuState = 'songs';
                    selectedMenuIndex = 0;
                    renderMenu();
                }
            } else if (currentMenuState === 'songs') {
                if (savedList.length > 0) {
                    playSavedSong(selectedMenuIndex);
                }
            } else if (currentMenuState === 'now_playing') {
                togglePlay();
            }
        });

        function togglePlay() {
            if (!audio.src) {
                fileInput.click();
                return;
            }
            if (audio.paused) {
                audio.play();
                playStateIndicator.textContent = '▶';
                centerActionBtn.textContent = 'PAUSE';
            } else {
                audio.pause();
                playStateIndicator.textContent = '❚❚';
                centerActionBtn.textContent = 'PLAY';
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        rewindBtn.addEventListener('click', () => {
            audio.currentTime = Math.max(0, audio.currentTime - 15);
        });

        forwardBtn.addEventListener('click', () => {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 15);
        });

        loopToggle.addEventListener('change', () => {
            audio.loop = loopToggle.checked;
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        speedRange.addEventListener('input', () => {
            const speed = parseFloat(speedRange.value);
            audio.playbackRate = speed;
            speedValue.textContent = speed.toFixed(2);
        });

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderMenu();
        });
    </script>
</body>
</html>
